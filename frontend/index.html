<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Travel Planner</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Mapbox GL JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
</head>
<body>

  <!-- ── Hero ───────────────────────────────────────────── -->
  <section id="hero">
    <div class="hero__inner">
      <h1><span aria-hidden="true">✈</span> AI Travel Planner</h1>
      <p class="hero__sub">Mô tả chuyến đi của bạn, AI sẽ lên lịch trình hoàn chỉnh.</p>

      <div id="chat-area">
        <div id="messages"></div>
        <div class="input-row">
          <textarea id="user-input" rows="3" aria-label="Mô tả chuyến đi của bạn"
            placeholder="Tôi muốn đi Đà Lạt 3 ngày 2 đêm, ngân sách 5 triệu, đi 2 người, thích cafe và thiên nhiên…"></textarea>
          <button id="send-btn">Gửi ✈</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ── Loading ────────────────────────────────────────── -->
  <div id="loading" class="hidden">
    <div class="spinner"></div>
    <p>Đang lên lịch trình…</p>
  </div>

  <!-- ── Result ─────────────────────────────────────────── -->
  <main id="result" class="hidden">

    <!-- Action buttons -->
    <div id="action-bar">
      <button class="action-btn" data-style="cheaper"><span aria-hidden="true">💰</span> Rẻ hơn</button>
      <button class="action-btn" data-style="relaxed"><span aria-hidden="true">🌿</span> Nhẹ nhàng hơn</button>
      <button class="action-btn" data-style="more_food"><span aria-hidden="true">🍜</span> Thêm ăn uống</button>
      <button id="regenerate-btn" class="action-btn action-btn--primary"><span aria-hidden="true">🔄</span> Tạo lại</button>
    </div>

    <div id="result-grid">

      <!-- Itinerary -->
      <section id="itinerary-panel">
        <h2>Lịch trình</h2>
        <div id="itinerary-content"></div>
      </section>

      <!-- Right column: Map + Budget -->
      <aside id="sidebar">
        <div id="map"></div>
        <section id="budget-panel">
          <h2>Ngân sách dự kiến</h2>
          <div id="budget-content"></div>
        </section>
      </aside>

    </div>
  </main>

  <script>/* Mapbox token injected via ?mapbox=TOKEN query param */</script>
  <script src="app.js"></script>
</body>
</html>
