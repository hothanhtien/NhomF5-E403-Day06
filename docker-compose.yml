services:

  # ── Backend: FastAPI ──────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: counter-backend
    env_file: .env
    expose:
      - "8000"            # internal only, nginx proxies đến đây
    networks:
      - app-network
    restart: unless-stopped

  # ── Nginx: serve frontend + proxy API ────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: tienop-nginx
    # Local test: mở port 8080 để browser truy cập
    # Production: bỏ dòng ports này, cloudflared sẽ kết nối qua internal network
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  # ── Cloudflare Tunnel ─────────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: counter-cloudflared
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - nginx
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
